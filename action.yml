name: 'Netbird connect'
description: 'Connect your workflow to your Netbird network'
inputs:
  setup-key:
    description: 'Setup key obtained from the Management Service Dashboard (used to register peer)'
    required: true
  hostname:
    description: 'Sets a custom hostname that is visible from Netbird Dashboard'
    required: false
    default: ''
  management-url:
    description: 'Management Service URL [http|https]://[host]:[port] (default "https://api.netbird.io:443")'
    required: false
    default: 'https://api.netbird.io:443'
  args:
    description: 'Optional additional arguments to `netbird up`'
    required: false
    default: ''
  version:
    description: 'NetBird release version to install (e.g. "0.81.3" or "latest")'
    required: false
    default: 'latest'
branding:
  icon: 'bar-chart'
  color: 'orange'
runs:
  using: 'composite'
  steps:
    - name: Check Runner OS
      if: ${{ runner.os != 'Linux' }}
      shell: bash
      run: |
        echo "::error title=error hint::Support Linux Only"
        exit 1
    - name: Resolve NetBird Version and Architecture
      id: meta
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64|amd64) ARCH="amd64" ;;
          i?86|x86) ARCH="386" ;;
          aarch64|arm64) ARCH="arm64" ;;
          armv6*) ARCH="armv6" ;;
          *)
            echo "::error title=Unsupported Architecture::Architecture ${ARCH} is not supported"
            exit 1
            ;;
        esac

        if [ -z "${INPUT_VERSION}" ] || [ "${INPUT_VERSION}" = "latest" ]; then
          RELEASE_JSON="$(curl -fsSL https://pkgs.netbird.io/releases/latest 2>/dev/null || true)"
          if [ -z "${RELEASE_JSON}" ]; then
            if [ -n "${GITHUB_TOKEN}" ]; then
              RELEASE_JSON="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/netbirdio/netbird/releases/latest)"
            else
              RELEASE_JSON="$(curl -fsSL https://api.github.com/repos/netbirdio/netbird/releases/latest)"
            fi
          fi
          VERSION="$(printf '%s' "${RELEASE_JSON}" | grep -Eo '"tag_name":[[:space:]]*"v[0-9]+\.[0-9]+\.[0-9]+"' | head -n 1 | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+')"
        else
          VERSION="v${INPUT_VERSION#v}"
        fi

        if [ -z "${VERSION}" ]; then
          echo "::error title=Version Resolution Failed::Unable to resolve NetBird release version"
          exit 1
        fi

        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "arch=${ARCH}" >> "${GITHUB_OUTPUT}"
    - name: Cache NetBird Binary
      id: cache-netbird
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/netbird-bin
        key: netbird-bin-${{ runner.os }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.version }}
    - name: Download and Install NetBird
      shell: bash
      env:
        VERSION: ${{ steps.meta.outputs.version }}
        ARCH: ${{ steps.meta.outputs.arch }}
        CACHE_HIT: ${{ steps.cache-netbird.outputs.cache-hit }}
        CACHE_DIR: ${{ runner.temp }}/netbird-bin
      run: |
        set -euo pipefail
        if [ "${CACHE_HIT}" != "true" ] || [ ! -x "${CACHE_DIR}/netbird" ]; then
          mkdir -p "${CACHE_DIR}"
          TMP_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/netbird-dl.XXXXXXXXXX")"
          trap 'rm -rf "${TMP_DIR}"' EXIT
          VERSION_NUM="${VERSION#v}"
          ARCHIVE="netbird_${VERSION_NUM}_linux_${ARCH}.tar.gz"
          DOWNLOAD_URL="https://github.com/netbirdio/netbird/releases/download/${VERSION}/${ARCHIVE}"
          echo "Downloading NetBird ${VERSION} (${ARCH}) from ${DOWNLOAD_URL}..."
          curl -fsSL --retry 3 --retry-connrefused -o "${TMP_DIR}/${ARCHIVE}" "${DOWNLOAD_URL}"
          tar -xzf "${TMP_DIR}/${ARCHIVE}" -C "${TMP_DIR}" netbird
          install -m 0755 "${TMP_DIR}/netbird" "${CACHE_DIR}/netbird"
        else
          echo "Using cached NetBird ${VERSION} (${ARCH}) binary"
        fi

        sudo install -m 0755 "${CACHE_DIR}/netbird" /usr/bin/netbird
        sudo mkdir -p /etc/netbird
        echo "package_manager=bin" | sudo tee /etc/netbird/install.conf > /dev/null
        sudo netbird service install 2>&1 || true
        sudo netbird service start 2>&1 || true
    - name: Connect to Netbird
      shell: bash
      env:
        SETUP_KEY: ${{ inputs.setup-key }}
        ADDITIONAL_ARGS: ${{ inputs.args }}
        HOSTNAME: ${{ inputs.hostname }}
        MANAGEMENT_URL: ${{ inputs.management-url }}
      run: |
        if [ -z "${HOSTNAME}" ]; then
          RUNNER_HOST="$(hostname 2>/dev/null || uname -n 2>/dev/null || cat /etc/hostname 2>/dev/null || echo 'runner')"
          HOSTNAME="github-${RUNNER_HOST}"
        fi
        sudo netbird up --setup-key=${SETUP_KEY} --hostname=${HOSTNAME} --management-url=${MANAGEMENT_URL} ${ADDITIONAL_ARGS}
    - name: Wait for Netbird to connect
      shell: bash
      run: |
          while [ -z "$(sudo netbird status | grep 'Management: Connected')" ]; do
          echo "Waiting for Netbird to connect..."
          sleep 5
          done
